<div class="wrap" id="root">

<script id="payload" type="application/octet-stream">__PAYLOAD__</script>
<script>
(async function(){
'use strict';
const root=document.getElementById('root');
let DATA;
try{
  if(!window.DecompressionStream)throw new Error('Please open this page in an up-to-date version of Chrome, Firefox, Edge or Safari.');
  // A plain loop over a preallocated buffer, not Uint8Array.from with a mapping
  // function: this runs over three million characters, and the callback form spends
  // most of the page's startup inside it.
  const raw=atob(document.getElementById('payload').textContent.trim());
  const bytes=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  DATA=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
}catch(e){
  root.innerHTML='<div class="loading"><h2>Cross-Reference Lab</h2><p>This page could not open. '+e.message+'</p></div>';
  return;
}

const BOOKS=DATA.books.map(([code,name,first,chapters])=>({code,name,first,chapters}));
const CHAPTERS=DATA.chapterVerses;
const N=CHAPTERS.length;
const NT=DATA.testamentSplit;
const COMPLETE=DATA.scope==='complete';
const TEXT=DATA.text.split('\n');
// Where each chapter starts in the global verse numbering, so a verse index can be named.
const CHAPTER_START=new Int32Array(DATA.chapterVerses.length);
for(let c=1,run=DATA.chapterVerses[0];c<DATA.chapterVerses.length;c++){CHAPTER_START[c]=run;run+=DATA.chapterVerses[c]}
const CHAPTER_OF_VERSE=new Int16Array(TEXT.length);
for(let c=0,v=0;c<DATA.chapterVerses.length;c++)for(let k=0;k<DATA.chapterVerses[c];k++)CHAPTER_OF_VERSE[v++]=c;
// Verse-level links, delta-decoded, and the chapter pairs derived from them.
const COUNT=DATA.links.length/4;
const VL_FROM=new Int32Array(COUNT),VL_TO=new Int32Array(COUNT),VL_SPAN=new Int16Array(COUNT),VL_VOTES=new Int16Array(COUNT);
for(let i=0,run=0;i<COUNT;i++){
  run+=DATA.links[i*4];
  VL_FROM[i]=run;VL_TO[i]=DATA.links[i*4+1];VL_SPAN[i]=DATA.links[i*4+2];VL_VOTES[i]=Math.min(32767,DATA.links[i*4+3]);
}
DATA.links=null;DATA.text=null;
const PAIR_COUNT=new Map();
const LINKS=(()=>{
  const pairs=PAIR_COUNT;
  for(let i=0;i<COUNT;i++){
    const a=CHAPTER_OF_VERSE[VL_FROM[i]],b=CHAPTER_OF_VERSE[VL_TO[i]];
    const key=a*2000+b;
    const row=pairs.get(key);
    if(row){row[2]++;row[3]+=VL_VOTES[i]}else pairs.set(key,[a,b,1,VL_VOTES[i]]);
  }
  return [...pairs.values()].sort((x,y)=>y[2]-x[2]);
})();
// How many verse links a chapter pair holds, so the passage list obeys the same
// threshold as the drawing rather than quietly showing more than the row promised.
const pairCount=(a,b)=>{const r=PAIR_COUNT.get(a*2000+b);return r?r[2]:0};
// The links arrive sorted by their source verse, so every link out of a given chapter
// sits in one unbroken run. FROM_AT[c] is where chapter c's run begins, which turns
// "the links leaving these chapters" into a slice instead of a walk through all of them.
// If the order is ever not what we expect, the index is left null and the search below
// falls back to reading everything, which is slower but never wrong.
const FROM_AT=(()=>{
  for(let i=1;i<COUNT;i++)if(CHAPTER_OF_VERSE[VL_FROM[i]]<CHAPTER_OF_VERSE[VL_FROM[i-1]])return null;
  const at=new Int32Array(N+2);
  for(let c=0,i=0;c<=N;c++){while(i<COUNT&&CHAPTER_OF_VERSE[VL_FROM[i]]<c)i++;at[c]=i}
  at[N+1]=COUNT;
  return at;
})();
const bookOfChapter=new Int16Array(N),chapterNumber=new Int16Array(N);
BOOKS.forEach((b,bi)=>{for(let c=0;c<b.chapters;c++){bookOfChapter[b.first+c]=bi;chapterNumber[b.first+c]=c+1}});
const shortName=n=>n.split(' of ')[0];
const textNorm=t=>(t||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
  .replace(/æ/g,'ae').replace(/œ/g,'oe').replace(/[^a-z0-9]+/g,' ').trim();
const label=i=>BOOKS[bookOfChapter[i]].name+' '+chapterNumber[i];
const verseLabel=v=>{const c=CHAPTER_OF_VERSE[v];return label(c)+':'+(v-CHAPTER_START[c]+1)};
// The same reference with the book's short name, for running prose.
const verseShort=v=>{const c=CHAPTER_OF_VERSE[v];
  return shortName(BOOKS[bookOfChapter[c]].name)+' '+chapterNumber[c]+':'+(v-CHAPTER_START[c]+1)};
const verseRange=(v,span)=>span?verseLabel(v)+'\u2013'+(v+span-CHAPTER_START[CHAPTER_OF_VERSE[v+span]]+1):verseLabel(v);
const maxVerses=Math.max.apply(null,CHAPTERS);
let sources=[...new Set(LINKS.map(l=>l[0]))].sort((a,b)=>a-b);
let sourceSlot=new Map(sources.map((c,i)=>[c,i]));
// A second order for the ring, kept entirely separate from the data: the links, the
// index and every chapter number stay canonical, and only where a chapter is *drawn*

const BOOK_BY_CODE=new Map(BOOKS.map((b,i)=>[b.code,i]));
function resolveRef(ref){
  const [code,ch,vs]=ref.split('.');
  const bi=BOOK_BY_CODE.get(code);
  if(bi===undefined)return null;
  const cn=Number(ch),vn=Number(vs);
  if(!Number.isInteger(cn)||cn<1||!Number.isInteger(vn)||vn<1)return null;
  const chapter=BOOKS[bi].first+cn-1;
  if(chapter<BOOKS[bi].first||chapter>=BOOKS[bi].first+BOOKS[bi].chapters)return null;
  // Bound by the chapter's own length, not by the whole text: without this a verse
  // number past the end of its chapter resolves silently into the next one, and a
  // mistyped reference would be shown under the label it was asked for.
  if(vn>CHAPTERS[chapter])return null;
  const verse=CHAPTER_START[chapter]+vn-1;
  return verse<TEXT.length?{chapter,verse}:null;
}
function buildChain(label,list){
  const stations=[];
  for(const [ref,note] of list){
    const at=resolveRef(ref);
    if(at)stations.push({ref,note,...at});
  }
  const steps=stations.slice(1).map((st,i)=>{
    const a=stations[i].chapter,b=st.chapter;
    return {a,b,attested:pairCount(a,b)>0||pairCount(b,a)>0};
  });
  state.chain={kind:'chain',label,stations,steps,attested:steps.filter(x=>x.attested).length};
}
// A concept's claimed origin against the passages that follow it. Each step is
// measured in both directions, because a first-mention claim is directional:
// the later passages are supposed to point back.
function buildOrigin(label,ref,note,later){
  const at=resolveRef(ref); if(!at)return;
  const origin={ref,note,...at};
  const stations=[origin],steps=[];
  for(const [r,n] of later){
    const a=resolveRef(r); if(!a)continue;
    const st={ref:r,note:n,...a};
    const back=pairCount(st.chapter,origin.chapter),fwd=pairCount(origin.chapter,st.chapter);
    steps.push({a:origin.chapter,b:st.chapter,back,fwd,attested:back>0,any:back>0||fwd>0});
    stations.push(st);
  }
  // Where the weight of the set actually falls: links each passage draws from the others.
  const weight=stations.map((s,i)=>{
    let n=0; for(const o of stations) if(o.chapter!==s.chapter) n+=pairCount(o.chapter,s.chapter);
    return {i,n};
  }).sort((x,y)=>y.n-x.n);
  state.chain={kind:'origin',label,stations,steps,
    attested:steps.filter(x=>x.attested).length,
    linked:steps.filter(x=>x.any).length,
    top:stations[weight[0].i],topN:weight[0].n,
    rank:weight.findIndex(w=>w.i===0)+1};
}
let normText=null;                                  // the ASV, normalised, built once
let threadVerse=null,threadPairs=null,threadLinkCount=0;
function buildThread(){
  threadVerse=null;threadPairs=null;threadLinkCount=0;
  if(!state.thread||!state.thread.words.length)return;
  if(!normText){
    normText=new Array(TEXT.length);
    for(let v=0;v<TEXT.length;v++)normText[v]=' '+textNorm(TEXT[v])+' ';
  }
  const words=state.thread.words.map(w=>' '+w);
  threadVerse=new Uint8Array(TEXT.length);
  for(let v=0;v<TEXT.length;v++){
    const t=normText[v];
    for(const w of words)if(t.indexOf(w)>=0){threadVerse[v]=1;break}
  }
  threadPairs=new Map();
  for(let i=0;i<COUNT;i++){
    if(!threadVerse[VL_FROM[i]])continue;
    let hit=false;
    for(let v=VL_TO[i];v<=VL_TO[i]+VL_SPAN[i];v++)if(threadVerse[v]){hit=true;break}
    if(!hit)continue;
    threadLinkCount++;
    const key=CHAPTER_OF_VERSE[VL_FROM[i]]*2000+CHAPTER_OF_VERSE[VL_TO[i]];
    threadPairs.set(key,(threadPairs.get(key)||0)+1);
  }
}

function inFocus(ci){return ci>=state.focus.from&&ci<=state.focus.to}

let byChapter=null,linkLayer=null,renderToken=0,progress=1;

  for(const l of LINKS)if(visible(l)){note(l[0],l);note(l[1],l)}

  focusHits=new Float32Array(N);focusHitMax=0;

// The wash is drawn at one device pixel per CSS pixel and built a slice at a time,

function renderBase(){
  const token=++renderToken;

  buildIndex();
  linkLayer=document.createElement('canvas');
  linkLayer.width=Math.max(1,W);linkLayer.height=Math.max(1,H);
  const c=linkLayer.getContext('2d');
  const dark=isDark();

  const dimmed=threading||!!state.chain;
  const alpha=state.view==='matrix'?(dark?.72:.6):(dark?.26:.2);
  const dim=dimmed?(state.view==='matrix'?.22:.16):1;
  c.lineCap='round';c.lineWidth=state.view==='circle'?.7:.6;
  const list=[];for(const l of LINKS)if(visible(l))list.push(l);
  if(threading)list.sort((a,b)=>(onThread(a)?1:0)-(onThread(b)?1:0));   // thread last, so it lies on top
  const CHUNK=state.view==='matrix'?80000:7000;
  let i=0;progress=list.length?0:1;
  (function step(){
    if(token!==renderToken)return;
    const stop=Math.min(list.length,i+CHUNK);
    if(state.view==='matrix'){
      for(;i<stop;i++){
        const l=list[i],lit=threading&&onThread(l);

        c.globalAlpha=lit?1:alpha*dim;
        const m=geom.matrix;

        c.globalAlpha=1;
      }
    }else if(!state.flow){
      const buckets=new Map();
      for(;i<stop;i++){

        let path=buckets.get(colour);

      }

    }else{

// ---- selection ----------------------------------------------------------
// A name is a target in its own right. The point is carried into the label's own
// frame - undoing the rotation that drew it - and tested against the box the text
// actually occupies, so the answer is the book whose name is under the pointer
// rather than whatever the ring happens to hold at that angle.
function labelAt(px,py){
  let best=null,bestD=Infinity;
  for(const L of labelHits){
    const dx=px-L.x,dy=py-L.y;
    const co=Math.cos(-L.rot),si=Math.sin(-L.rot);
    const u=dx*co-dy*si,v=dx*si+dy*co;          // along the text, and across it
    const pad=4;
    if(v<-L.h-pad||v>L.h*0.45+pad)continue;
    if(L.flip?(u<-L.w-pad||u>pad):(u<-pad||u>L.w+pad))continue;
    // Names crowd and their boxes overlap, so prefer the one the pointer is nearest the
    // middle of rather than whichever was drawn last.
    const mid=L.flip?-L.w/2:L.w/2;
    const d=Math.abs(u-mid)/Math.max(8,L.w)+Math.abs(v+L.h*0.3)/Math.max(8,L.h);
    if(d<bestD){bestD=d;best=L.chapter}

}
function chapterAt(px,py){

  if(state.view==='arc'){const u=Math.round((px-geom.arc.pad)/geom.arc.step-0.5);return u>=0&&u<N?ATSLOT[u]:null}

    const {cx,cy,R,Rin,focused}=geom.circle,dx=px-cx,dy=py-cy,r=Math.hypot(dx,dy);

    const wrap=(x,m)=>((Math.round(x)%m)+m)%m;      // the twelve o'clock join belongs to the first slot

      const n=state.focus.to-state.focus.from+1;
      return state.focus.from+(((geom.dialZero-state.focus.from)+wrap(a/(Math.PI*2)*n,n))%n);

}
function matrixAt(px,py){

// that has not changed, and rebuilding a hundred and ninety thousand chords to move a
// highlight is work nobody asked for. Both the chapter being let go and the one being
// taken count, since either can be the one the dial was pointing at.
function turnsTheDial(next){

function select(ci){

canvas.addEventListener('pointermove',e=>{

// A list row that opens in place, in the manner of the Atlas's connection cards,
// with the full set still available underneath.
function linkRow({colour,text,count,pair,title,extra}){

  });

let passageState=null;
// Every link row opens the text behind it, whether that row is one chapter or a whole book.
function findLinks(aFrom,aTo,bFrom,bTo){
  const found=[];
  // A link can only count here if it leaves one of the two ranges, so only those two
  // runs need reading. Every test inside the loop is the one the exhaustive form used,
  // so the answer is the same set in the same order — just reached without walking the
  // three hundred thousand links that cannot qualify.
  const spans=[];
  if(FROM_AT){
    const a=[FROM_AT[Math.max(0,aFrom)],FROM_AT[Math.min(N,aTo+1)]];
    const b=[FROM_AT[Math.max(0,bFrom)],FROM_AT[Math.min(N,bTo+1)]];
    const lo=a[0]<=b[0]?a:b,hi=a[0]<=b[0]?b:a;
    if(hi[0]<=lo[1])spans.push([lo[0],Math.max(lo[1],hi[1])]);   // they touch: one run
    else{spans.push(lo);spans.push(hi)}
  }else spans.push([0,COUNT]);
  for(const [lo,hi] of spans)for(let i=lo;i<hi;i++){
    const ca=CHAPTER_OF_VERSE[VL_FROM[i]],cb=CHAPTER_OF_VERSE[VL_TO[i]];
    const forward=ca>=aFrom&&ca<=aTo&&cb>=bFrom&&cb<=bTo;
    const back=ca>=bFrom&&ca<=bTo&&cb>=aFrom&&cb<=aTo;
    if(!forward&&!back)continue;
    if(pairCount(ca,cb)<state.min)continue;
    if(state.focus){
      if(state.dir==='out'&&!forward)continue;
      if(state.dir==='in'&&!back)continue;
    }
    found.push(i);
  }
  // Total order, so the list does not depend on the order candidates were reached.
  found.sort((x,y)=>VL_VOTES[y]-VL_VOTES[x]||VL_FROM[x]-VL_FROM[y]||x-y);
  return found;
}

// ---- word search ---------------------------------------------------------
// Every Hebrew and Greek word of the Bible, by Strong number: 542,487 occurrences of
// 16,328 words, from STEPBible's tagging of the Westminster Leningrad Codex and the
// Greek editions. Occurrence lists are delta-coded over the same verse numbering the
// links use, so a word's verses drop straight onto the diagram.
//
// What this answers is a question, not an opinion: where does this word stand? The
// glosses are a lexicon's choice of one English word, and are labelled as such.
const WORDS=DATA.words;
const W_DEC=new Map();           // Strong -> verse indices, decoded on first use
function wVerses(key){
  let got=W_DEC.get(key);
  if(got)return got;
  const i=WORDS.keys.indexOf(key);
  if(i<0)return [];
  let p=0;got=WORDS.occ[i].map(d=>p+=d);
  W_DEC.set(key,got);
  return got;
}
// A Psalm superscription has no verse number in this text, so it sits past the end of
// the verse list and is named rather than numbered.
const W_FIRST_EXTRA=CHAPTER_OF_VERSE.length;
const wIsTitle=v=>v>=W_FIRST_EXTRA;
const wLabel=v=>wIsTitle(v)?(WORDS.extra[v-W_FIRST_EXTRA]||'').replace(/^Ps\.(\d+)\.0$/,'Psalm $1, title'):verseLabel(v);
const W_AFFIX=new Set(WORDS.affixes||[]);

// Strong numbers are written zero-padded here, and STEPBible splits some of them by
// sense - H0430G, H0430H and so on are all Strong's 430. A search for 430 should find
// every one of them rather than nothing.
function wByNumber(q){
  const m=/^([hgHG])?0*(\d{1,4})([a-zA-Z])?$/.exec(q.trim());
  if(!m)return null;
  const lang=m[1]?m[1].toUpperCase():'', num=m[2].padStart(4,'0'), suffix=(m[3]||'').toUpperCase();
  return WORDS.keys.filter(k=>{
    if(lang&&k[0]!==lang)return false;
    const body=k.slice(1).replace(/[A-Za-z]$/,'');
    if(body!==num)return false;
    return !suffix||k.endsWith(suffix);
  });
}
// Nobody types polytonic Greek accents, and the transliterations here carry macrons
// and syllable dots: "chesed" is written che.sed, "agape" is agapē. So both the query
// and the text are folded to bare letters before they are compared — accents and
// breathings stripped, macrons flattened, dots and apostrophes dropped. A search then
// finds a word however the person happens to be able to type it.
const wFold=t=>(t||'').normalize('NFD').replace(/[\u0300-\u036f\u0483-\u0489]/g,'')
  .toLowerCase().replace(/[.'\u2019\u02bc\u02bb_\u05b0-\u05c7-]/g,'');
let W_FOLDED=null;
function wIndex(){
  if(W_FOLDED)return W_FOLDED;
  W_FOLDED=WORDS.keys.map(k=>{const e=WORDS.lex[k]||[];
    return wFold(e[1])+'\u0001'+wFold(e[2])+'\u0001'+wFold(e[3])});
  return W_FOLDED;
}
function wSearch(q){
  q=q.trim();
  if(q.length<2)return null;
  const byNum=wByNumber(q);
  if(byNum&&byNum.length)return byNum;
  const needle=wFold(q);
  if(!needle)return [];
  const idx=wIndex(),hit=[];
  for(let i=0;i<WORDS.keys.length;i++)if(idx[i].includes(needle))hit.push(WORDS.keys[i]);
  // A word whose gloss or lemma *is* what was asked for comes before one that merely
  // contains it; nothing else is ranked, and order within each group is canonical.
  const exact=k=>{const e=WORDS.lex[k]||[];return wFold(e[1])===needle||wFold(e[2])===needle||wFold(e[3])===needle};
  // Within each group the commoner word comes first. That is a count of where the word
  // stands, not a judgement about which sense matters.
  const often=(a,b)=>wVerses(b).length-wVerses(a).length;
  return [...hit.filter(exact).sort(often),...hit.filter(k=>!exact(k)).sort(often)];
}
function wRender(){
  const q=document.getElementById('w-q').value;
  const out=document.getElementById('w-out'),note=document.getElementById('w-note');
  out.innerHTML='';
  const keys=wSearch(q);
  if(keys===null){
    document.getElementById('w-sub').textContent=fmt(WORDS.keys.length)+' Hebrew and Greek words, '+fmt(WORDS.occurrences)+' occurrences';
    note.textContent='Type two letters or more. '+WORDS.attribution+'. The English under a word is a lexicon’s gloss — one English word standing in for one Hebrew or Greek one — not a translation of the sentence it sits in.';
    return;
  }
  const real=keys.filter(k=>!W_AFFIX.has(k)), affix=keys.filter(k=>W_AFFIX.has(k));
  document.getElementById('w-sub').textContent=keys.length?fmt(keys.length)+' matching word'+(keys.length===1?'':'s'):'nothing matches';
  if(!keys.length){
    note.textContent='Nothing matches that. Try the English gloss (love), a transliteration (agape, chesed), the word itself, or a Strong number (H2617, G26).';
    return;
  }
  const list=document.createElement('div');list.className='w-list';
  const show=(k)=>{
    const e=WORDS.lex[k],verses=wVerses(k);
    const row=document.createElement('div');row.className='w-row';
    const head=document.createElement('button');head.type='button';head.className='w-head';
    head.innerHTML='<b lang="'+(e[0]?'he':'el')+'" dir="'+(e[0]?'rtl':'ltr')+'"></b><span class="w-tr"></span><span class="w-gl"></span><span class="w-code"></span><span class="w-n"></span>';
    head.querySelector('b').textContent=e[1]||k;
    head.querySelector('.w-tr').textContent=e[2]||'';
    head.querySelector('.w-gl').textContent=e[3]||'';
    head.querySelector('.w-code').textContent=k+(W_AFFIX.has(k)?' · prefix or ending':'');
    head.querySelector('.w-n').textContent=fmt(verses.length)+' verse'+(verses.length===1?'':'s');
    const body=document.createElement('div');body.className='w-verses';body.hidden=true;
    head.addEventListener('click',()=>{
      if(!body.dataset.filled){
        for(const v of verses.slice(0,400)){
          const b=document.createElement('button');b.type='button';b.textContent=wLabel(v);
          if(!wIsTitle(v))b.addEventListener('click',()=>{
            state.focus=null;chip();renderBase();select(CHAPTER_OF_VERSE[v]);caption();
            document.getElementById('plot').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
          });
          else b.disabled=true;
          body.appendChild(b);
        }
        if(verses.length>400){const m=document.createElement('em');m.textContent=' and '+fmt(verses.length-400)+' more';body.appendChild(m)}
        body.dataset.filled='1';
      }
      body.hidden=!body.hidden;
      head.setAttribute('aria-expanded',String(!body.hidden));
    });
    row.append(head,body);
    // The fuller sense, where the lexicon gives one beyond the single-word gloss.
    if(e[4]){const sn=document.createElement('p');sn.className='w-sense';sn.textContent=e[4];row.insertBefore(sn,body)}
    list.appendChild(row);
  };
  real.slice(0,60).forEach(show);
  if(affix.length){
    const h=document.createElement('p');h.className='w-affix';
    h.textContent='Hebrew prefixes, endings and marks that match — the "and", "the", "in", "his" that English writes as separate words, and the maqqef and sof pasuq it does not write at all:';
    list.appendChild(h);
    affix.slice(0,12).forEach(show);
  }
  out.appendChild(list);
  note.textContent=(real.length>60?'Showing the first 60 of '+fmt(real.length)+' words. ':'')
    +WORDS.attribution+'. Click a word to see every verse it stands in; click a verse to bring that chapter up on the diagram.';
}

const norm=s=>s.toLowerCase().replace(/^1\s*/,'i ').replace(/^2\s*/,'ii ').replace(/^3\s*/,'iii ').replace(/[^a-z0-9]+/g,'');
// Contractions people actually type, which are not prefixes of the full name.
const EXTRA={Gen:'gn ge',Exod:'ex exo',Lev:'lv',Num:'nm',Deut:'dt',Josh:'jos',Judg:'jdg jg',Ruth:'rth',
 '1Sam':'1sa 1sm firstsamuel','2Sam':'2sa 2sm secondsamuel','1Kgs':'1ki 1kg firstkings','2Kgs':'2ki 2kg secondkings',
 '1Chr':'1ch firstchronicles','2Chr':'2ch secondchronicles',Neh:'ne',Esth:'es',Ps:'psa psalm',Prov:'pr prv',
 Eccl:'ec qoheleth',Song:'sos sng canticles',Isa:'is',Jer:'jr',Lam:'lm',Ezek:'ezk eze',Dan:'dn',Hos:'ho',
 Obad:'ob',Jonah:'jon',Mic:'mi',Nah:'na',Hab:'hb',Zeph:'zep',Hag:'hg',Zech:'zec',Mal:'ml',
 Matt:'mt mat',Mark:'mk mr',Luke:'lk',John:'jn jhn',Acts:'ac',Rom:'rm',
 '1Cor':'1co firstcorinthians','2Cor':'2co secondcorinthians',Gal:'ga',Eph:'ep',Phil:'php',Col:'co',
 '1Thess':'1th','2Thess':'2th','1Tim':'1ti','2Tim':'2ti',Titus:'ti',Phlm:'phm',Heb:'hb heb',Jas:'jm jas',
 '1Pet':'1pe','2Pet':'2pe','1John':'1jn','2John':'2jn','3John':'3jn',Jude:'jud',Rev:'rv apocalypse'};
const ALIASES=BOOKS.map((b,bi)=>({bi,keys:[norm(b.name),norm(shortName(b.name)),norm(b.code)]
  .concat((EXTRA[b.code]||'').split(' ').filter(Boolean).map(x=>x.toLowerCase().replace(/[^a-z0-9]+/g,'')))}));
const totalsByChapter=(()=>{const m=new Map();for(const l of LINKS){m.set(l[0],(m.get(l[0])||0)+l[2]);m.set(l[1],(m.get(l[1])||0)+l[2])}return m})();
function lookup(query){
  const text=query.trim();
  if(!text)return [];
  const m=text.match(/^(.*?)[\s.]*(\d+)?\s*[:.]?\s*(\d+)?\s*$/);
  const rawName=(m&&m[1]?m[1]:text).toLowerCase().replace(/[^a-z0-9]+/g,'');
  const namePart=norm(m&&m[1]?m[1]:text), chapterPart=m&&m[2]?+m[2]:null;
  if(!namePart&&!rawName)return [];
  const score=a=>{
    const k=a.keys;
    if(k.some(x=>x===namePart||x===rawName))return 0;              // the book's own code or name
    if(k.some(x=>x.startsWith(namePart)||(rawName&&x.startsWith(rawName))))return 1;
    if(k.some(x=>x.includes(namePart)||(rawName&&x.includes(rawName))))return 2;
    return 9;
  };
  const ranked=ALIASES.map(a=>({a,s:score(a)})).filter(x=>x.s<9)
    .sort((x,y)=>{
      if(chapterPart){                                              // a book that has that chapter comes first
        const hx=chapterPart<=BOOKS[x.a.bi].chapters?0:1, hy=chapterPart<=BOOKS[y.a.bi].chapters?0:1;
        if(hx!==hy)return hx-hy;
      }
      return x.s-y.s||x.a.bi-y.a.bi;
    });
  const out=[];
  const sq=namePart||rawName;
  SECTIONS.map(sec=>{
    const keys=[norm(sec.name)].concat(sec.alias.split(' '));
    const rank=keys.some(k=>k===sq)?0:keys.some(k=>k.startsWith(sq))?1:keys.some(k=>k.includes(sq))?2:9;
    return {sec,rank};
  }).filter(x=>x.rank<9).sort((a,b)=>a.rank-b.rank).slice(0,3)
    .forEach(({sec})=>out.push({kind:'range',from:sec.from,to:sec.to,label:sec.name,
      text:sec.name+' · section',n:(sec.to-sec.from+1)+' chapters'}));
  for(const {a} of ranked){
    const b=BOOKS[a.bi];
    if(chapterPart&&chapterPart>=1&&chapterPart<=b.chapters){
      const ci=b.first+chapterPart-1;
      out.push({kind:'chapter',ci,text:label(ci),n:totalsByChapter.get(ci)||0});
    }
    out.push({kind:'range',from:b.first,to:b.first+b.chapters-1,label:shortName(b.name),text:shortName(b.name)+' · whole book',n:b.chapters+' chapters'});
    if(out.length>=8)break;
  }
  return out.slice(0,8);
}
const input=document.getElementById('q'),results=document.getElementById('results');
function showResults(){
  const items=lookup(input.value);
  results.innerHTML='';
  if(!items.length){results.hidden=true;return}
  items.forEach(it=>{
    const b=document.createElement('button');b.type='button';
    const t=document.createElement('span');t.textContent=it.text;
    const n=document.createElement('span');n.className='n';n.textContent=typeof it.n==='number'?fmt(it.n)+' links':it.n;
    b.append(t,n);
    b.addEventListener('click',()=>{choose(it)});
    results.appendChild(b);
  });
  results.hidden=false;
}
function choose(it){
  results.hidden=true;
  input.value=it.kind==='chapter'?it.text:it.label;
  if(it.kind==='chapter'){state.focus=null;chip();renderBase();select(it.ci);caption()}
  else{state.focus={from:it.from,to:it.to,label:it.label};state.locked=null;chip();renderBase();describe();caption()}
}
input.addEventListener('input',showResults);
input.addEventListener('focus',showResults);
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const items=lookup(input.value);if(items.length){e.preventDefault();choose(items[0])}}
  if(e.key==='Escape'){results.hidden=true;input.blur()}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.hidden=true});
function chip(){
  const slot=document.getElementById('chipslot');slot.innerHTML='';
  document.getElementById('dirslot').hidden=!state.focus;
  const sel=document.getElementById('section');
  if(sel)sel.value=state.focus&&SECTIONS.some(x=>x.name===state.focus.label)?state.focus.label:'';
  if(!state.focus)return;
  const c=document.createElement('span');c.className='chip';
  c.append(document.createTextNode('Only '+state.focus.label));
  const x=document.createElement('button');x.type='button';
  x.setAttribute('aria-label','Show the whole Bible again');x.textContent='×';
  x.addEventListener('click',clearFocus);
  c.appendChild(x);slot.appendChild(c);
}
function clearFocus(){state.focus=null;input.value='';chip();renderBase();describe();caption()}

// ---- controls -----------------------------------------------------------
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>{
  state.view=b.dataset.view;
  document.querySelectorAll('.views button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render();describe();
}));
document.getElementById('colour').addEventListener('change',e=>{state.colour=e.target.value;renderBase();legend();describe()});
document.getElementById('order').addEventListener('change',e=>{
  state.order=e.target.value;buildOrder();renderBase();describe();caption();
});
(function(){
  const pick=document.getElementById('threadPick'),wrap=document.getElementById('threadWords'),
        input=document.getElementById('threadInput'),apply=document.getElementById('threadApply');
  const gChain=document.createElement('optgroup');gChain.label='Named chains of passages';
  CHAINS.forEach(([name],i)=>{const o=document.createElement('option');o.value='chain:'+i;o.textContent=name;gChain.appendChild(o)});
  pick.appendChild(gChain);
  const gOrigin=document.createElement('optgroup');gOrigin.label='First mention — a concept and where it begins';
  ORIGINS.forEach(([name],i)=>{const o=document.createElement('option');o.value='origin:'+i;o.textContent=name;gOrigin.appendChild(o)});
  pick.appendChild(gOrigin);
  const gWords=document.createElement('optgroup');gWords.label='Words in the text at both ends';
  THREADS.forEach(([name,words])=>{const o=document.createElement('option');o.value=words;o.textContent=name;gWords.appendChild(o)});
  const custom=document.createElement('option');custom.value='custom';custom.textContent='Words of my own\u2026';gWords.appendChild(custom);
  pick.appendChild(gWords);
  const run=(label,words)=>{
    const list=textNorm(words).split(' ').filter(w=>w.length>=3);
    state.chain=null;
    state.thread=list.length?{label,words:list}:null;
    buildThread();renderBase();describe();note();
  };
  const runChain=i=>{
    state.thread=null;buildThread();
    buildChain(CHAINS[i][0],CHAINS[i][1]);
    renderBase();describe();note();
  };
  const runOrigin=i=>{
    state.thread=null;buildThread();
    buildOrigin(ORIGINS[i][0],ORIGINS[i][1],ORIGINS[i][2],ORIGINS[i][3]);
    renderBase();describe();note();
  };
  const note=()=>{
    let el=document.getElementById('threadNote');
    if(!el){el=document.createElement('p');el.id='threadNote';el.className='thread-note';
      document.querySelector('.bar').after(el)}
    if(state.chain&&state.chain.kind==='origin'){
      const ch=state.chain,fwdOnly=ch.linked-ch.attested;
      el.innerHTML='<b>'+ch.label+'</b> \u2014 the claimed first mention is <b>'+verseShort(ch.stations[0].verse)+'</b>. '+
        'Which passage comes first is a reading and cannot be computed; what the data can test is whether the rest point back to it. '+
        '<b>'+ch.attested+' of '+ch.steps.length+'</b> '+(ch.attested===1?'does':'do')+
        (fwdOnly?', and '+fwdOnly+' more '+(fwdOnly>1?'are':'is')+' linked only in the other direction':'')+
        '. The weight of the set falls on <b>'+verseShort(ch.top.verse)+'</b> ('+fmt(ch.topN)+
        ' links from the others); the claimed origin ranks '+ch.rank+' of '+ch.stations.length+'. '+
        'A low count does not refute the reading \u2014 it says the connection is the reader\u2019s rather than one the editors marked.';
      return;
    }
    if(state.chain){
      const ch=state.chain;
      el.innerHTML='<b>'+ch.label+'</b> \u2014 '+ch.stations.length+' passages, in canonical order. '+
        'The chain is a reading, held in this page as a fixed list; what the data decides is whether each step is attested: '+
        '<b>'+ch.attested+' of '+ch.steps.length+'</b> consecutive pairs have a direct cross-reference between those chapters. '+
        (ch.attested===ch.steps.length?'Every step is attested; the chain holds all the way through.':'Solid steps are attested, dashed ones are not.');
      return;
    }
    if(!state.thread){el.remove();return}
    el.innerHTML='<b>'+state.thread.label+'</b> \u2014 '+fmt(threadLinkCount)+' of '+fmt(COUNT)+
      ' links have one of <em>'+state.thread.words.join(', ')+'</em> in the text at both ends. '+
      'This is a word search over the ASV, not a doctrine: it shows where those words meet across the links, and the words are yours to change.';
  };
  pick.addEventListener('change',e=>{
    if(e.target.value.startsWith('chain:')){wrap.hidden=true;runChain(+e.target.value.slice(6));return}
    if(e.target.value.startsWith('origin:')){wrap.hidden=true;runOrigin(+e.target.value.slice(7));return}
    if(e.target.value==='custom'){wrap.hidden=false;input.focus();return}
    wrap.hidden=!e.target.value;
    if(!e.target.value){state.chain=null;run('',''); return}
    input.value=e.target.value;
    run(pick.options[pick.selectedIndex].textContent,e.target.value);
  });
  apply.addEventListener('click',()=>run('My thread',input.value));
  input.addEventListener('keydown',e=>{if(e.key==='Enter')run('My thread',input.value)});
})();
document.getElementById('flow').addEventListener('change',e=>{state.flow=e.target.checked;renderBase()});
document.getElementById('cbsafe').addEventListener('change',e=>{state.cbsafe=e.target.checked;renderBase();legend();describe()});
document.getElementById('minlinks').addEventListener('input',e=>{
  state.min=+e.target.value;document.getElementById('minlabel').textContent=e.target.value;renderBase();describe();
});
(function(){
  const sel=document.getElementById('section');
  SECTIONS.forEach(x=>{const o=document.createElement('option');o.value=x.name;o.textContent=x.name;sel.appendChild(o)});
  sel.addEventListener('change',e=>{
    const sec=SECTIONS.find(x=>x.name===e.target.value);
    if(!sec){clearFocus();return}
    state.focus={from:sec.from,to:sec.to,label:sec.name};state.locked=null;input.value='';
    chip();renderBase();describe();caption();
  });
})();
document.getElementById('direction').addEventListener('change',e=>{state.dir=e.target.value;renderBase();describe()});
document.getElementById('clear').addEventListener('click',()=>{
  state.locked=null;state.hover=null;state.focus=null;state.dir='both';
  document.getElementById('direction').value='both';input.value='';chip();renderBase();describe();
});
let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(render,160)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{renderBase();legend()});


// ---- notebook -----------------------------------------------------------
// Two kinds of thing are worth keeping, and they are not the same. A bookmark keeps
// *where you were* - the view, the order, the focus, what was held - so one click
// brings the whole arrangement back. A note keeps *what you found* - the passage, the
// numbers behind it and, if you want, the drawing as it stood - so it can be carried
// out of here into a lesson. Notes are the only thing the slide deck is made of.
//
// Everything lives in this browser and nowhere else. Browser storage is per-machine
// and unreliable under file:// on some browsers, so it is a convenience and the saved
// file is the real copy: the notebook works with storage refused.
// The slide deck, the file reader and the download are shared with the Gospel Atlas,
// inlined here from src/notebook-kit.js so that one slide design serves both and a
// lesson can be built from notes kept in either.
__DECK__
const APP='cross-reference-lab';
const NB_KEY='gospel-atlas-lab-notebook';
let NB=[];
const nbSave=()=>{try{localStorage.setItem(NB_KEY,JSON.stringify(NB))}catch(e){}};
try{const raw=localStorage.getItem(NB_KEY);if(raw)NB=JSON.parse(raw)||[]}catch(e){NB=[]}
const nbEl=id=>document.getElementById(id);
const safe=safeName;

// A small picture of the drawing as it stands. Full size is close to half a megabyte,
// which a deck of twenty would not survive, so it is scaled down on the way out.
function snapshot(maxW){
  const c=document.getElementById('plot');
  if(!c||!c.width)return null;
  const w=Math.min(maxW||1000,c.width),h=Math.round(c.height*(w/c.width));
  const o=document.createElement('canvas');o.width=w;o.height=h;
  const x=o.getContext('2d');
  x.fillStyle=css('--paper')||'#fff';x.fillRect(0,0,w,h);
  x.drawImage(c,0,0,w,h);
  try{return o.toDataURL('image/jpeg',0.82)}catch(e){return null}
}
const viewState=()=>({view:state.view,order:state.order,colour:state.colour,cbsafe:state.cbsafe,
  flow:state.flow,min:state.min,dir:state.dir,locked:state.locked,
  focus:state.focus?{from:state.focus.from,to:state.focus.to,label:state.focus.label}:null,
  thread:state.thread?{label:state.thread.label||null}:null,
  chainLabel:state.chain?state.chain.label:null});
function describeState(v){
  const bits=[({arc:'Arc',circle:'Circle',matrix:'Matrix'})[v.view]||v.view];
  if(v.order==='chronological')bits.push('chronological');
  bits.push(v.focus?v.focus.label:'whole Bible');
  if(v.chainLabel)bits.push(v.chainLabel);
  if(v.locked!=null)bits.push('holding '+label(v.locked));
  if(v.min>1)bits.push('at least '+v.min+' links');
  if(v.dir!=='both')bits.push(v.dir==='out'?'outgoing only':'incoming only');
  return bits.join(' · ');
}
function addNote(withImage){
  const title=(nbEl('p-title').textContent||'').trim();
  if(!title||title==='Start anywhere'){nbFlash('Choose a chapter or a link first — a note keeps what the panel shows.');return}
  const v=viewState();
  NB.push({kind:'note',id:Date.now()+''+NB.length,title,app:APP,
    eyebrow:(nbEl('p-eyebrow').textContent||'').trim(),
    sub:(nbEl('p-sub').textContent||'').trim(),
    at:v,atText:describeState(v),when:nbNow(),body:'',
    img:withImage===false?null:snapshot(1000)});
  nbSave();nbRender(true);
}
function addMark(){
  const v=viewState();
  NB.push({kind:'bookmark',id:Date.now()+''+NB.length,title:describeState(v),app:APP,
    at:v,atText:describeState(v),when:nbNow(),body:''});
  nbSave();nbRender(true);
}
function restore(v){
  state.view=v.view;state.order=v.order||'canonical';state.colour=v.colour||'distance';
  state.cbsafe=!!v.cbsafe;state.flow=v.flow!==false;state.min=v.min||1;state.dir=v.dir||'both';
  state.focus=v.focus?{...v.focus}:null;state.locked=v.locked==null?null:v.locked;
  state.thread=null;state.chain=null;
  const set=(id,val)=>{const e=document.getElementById(id);if(e)e.value=val};
  set('order',state.order);set('colour',state.colour);set('direction',state.dir);
  set('section',state.focus?state.focus.label:'');set('threadPick','');
  const cb=document.getElementById('cbsafe');if(cb)cb.checked=state.cbsafe;
  const mn=document.getElementById('minlinks');if(mn)mn.value=state.min;
  document.querySelectorAll('.views button').forEach(b=>{
    const on=b.dataset.view===state.view;b.setAttribute('aria-pressed',on?'true':'false')});
  try{chip()}catch(e){}
  buildOrder();render();legend();describe();
  document.getElementById('plot').scrollIntoView({block:'center',behavior:'smooth'});
}
function nbFlash(msg){const f=nbEl('nb-foot');if(!f)return;f.textContent=msg;
  nbEl('notebook').hidden=false;nbEl('nbOpen').setAttribute('aria-expanded','true');
  setTimeout(()=>{if(f.textContent===msg)nbRender()},4000)}
function nbRender(open){
  nbEl('nbCount').textContent=NB.length;
  if(open){nbEl('notebook').hidden=false;nbEl('nbOpen').setAttribute('aria-expanded','true')}
  const notes=NB.filter(x=>x.kind==='note').length,marks=NB.length-notes;
  nbEl('nb-title').textContent=NB.length?(notes+' note'+(notes===1?'':'s')+', '+marks+' bookmark'+(marks===1?'':'s')):'Nothing kept yet';
  const list=nbEl('nb-list');list.innerHTML='';
  NB.forEach((it,i)=>{
    const li=document.createElement('li');li.className='nb-item';
    const mine=!it.app||it.app===APP;
    const thumb=it.img?'<img alt="" src="'+it.img+'">':'<div class="nb-kind '+(it.kind==='bookmark'?'mark':'')+'">'+(it.kind==='bookmark'?'VIEW':'NOTE')+'</div>';
    li.innerHTML='<div>'+thumb+'</div><div><p class="nb-kind '+(it.kind==='bookmark'?'mark':'')+'">'
      +(mine?'':(APP_NAMES[it.app]||it.app)+' · ')
      +(it.kind==='bookmark'?'BOOKMARK':(it.eyebrow||'NOTE'))+' · '+it.when+'</p>'
      +'<h3></h3><p class="meta"></p><textarea placeholder="Your own words — this is what the slide will say."></textarea></div>'
      +'<div class="nb-ops">'+(mine?'<button data-op="go">Open</button>':'')+'<button data-op="up">Up</button>'
      +'<button data-op="down">Down</button><button data-op="del">Remove</button></div>';
    li.querySelector('h3').textContent=it.title;
    const meta=(it.kind==='note'&&it.sub?it.sub+' — ':'')+(it.atText||describeState(it.at));
    // A bookmark's title already is its description; printing it twice says nothing.
    li.querySelector('.meta').textContent=meta===it.title?'':meta;
    const ta=li.querySelector('textarea');ta.value=it.body||'';
    ta.addEventListener('input',()=>{it.body=ta.value;nbSave()});
    li.querySelectorAll('.nb-ops button').forEach(btn=>btn.addEventListener('click',()=>{
      const op=btn.dataset.op;
      if(op==='go')return restore(it.at);
      if(op==='del')NB.splice(i,1);
      if(op==='up'&&i>0)NB.splice(i-1,0,NB.splice(i,1)[0]);
      if(op==='down'&&i<NB.length-1)NB.splice(i+1,0,NB.splice(i,1)[0]);
      nbSave();nbRender();
    }));
    list.appendChild(li);
  });
  nbEl('nb-foot').textContent=NB.length
    ? 'Kept in this browser only. Save the file to move them to another machine, or to keep them at all.'
    : 'Nothing kept yet.';
}
function deck(){
  const items=NB.filter(x=>x.kind==='note'||x.body);
  if(!items.length){nbFlash('Add a note or two first — the deck is made of them.');return}
  download(safe(deckTitle()).replace(/ /g,'_')+'.html',
    new Blob([deckHtml(items,deckTitle())],{type:'text/html'}));
  nbFlash('Deck saved — '+items.length+' slide'+(items.length===1?'':'s')+'. Open it in any browser; print it for a PDF.');
}
const deckTitle=()=>'Cross-Reference Lab notes '+new Date().toISOString().slice(0,10);
nbEl('addNote').addEventListener('click',()=>addNote(true));
nbEl('addMark').addEventListener('click',addMark);
nbEl('snapPng').addEventListener('click',()=>{
  // Encoding the whole canvas takes a second or two on a large screen, and a button
  // that does nothing visible for two seconds reads as a button that does not work.
  const c=document.getElementById('plot'),btn=nbEl('snapPng');
  if(!c)return;
  const was=btn.textContent;btn.textContent='Saving\u2026';btn.disabled=true;
  const done=t=>{btn.textContent=t;setTimeout(()=>{btn.textContent=was;btn.disabled=false},1800)};
  try{c.toBlob(bl=>{
    if(!bl)return done('Not saved');
    download(safe(describeState(viewState())).replace(/ /g,'_')+'.png',bl);done('Saved');
  },'image/png')}catch(e){done('Not saved')}
});
nbEl('nbOpen').addEventListener('click',()=>{
  const n=nbEl('notebook');n.hidden=!n.hidden;
  nbEl('nbOpen').setAttribute('aria-expanded',n.hidden?'false':'true');
  if(!n.hidden)n.scrollIntoView({block:'nearest',behavior:'smooth'});
});
nbEl('nbClose').addEventListener('click',()=>{nbEl('notebook').hidden=true;nbEl('nbOpen').setAttribute('aria-expanded','false')});
nbEl('nbDeck').addEventListener('click',deck);
nbEl('nbSave').addEventListener('click',()=>download('lab-notebook-'+new Date().toISOString().slice(0,10)+'.json',
  new Blob([JSON.stringify({app:APP,version:1,saved:nbNow(),items:NB},null,1)],{type:'application/json'})));
nbEl('nbLoad').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const got=readNotebook(r.result,APP);
    NB=NB.concat(got);
    nbSave();nbRender(true);nbFlash('Added '+got.length+' from the file.');
  }catch(err){nbFlash('That file could not be read as a notebook.')}};
  r.readAsText(f);e.target.value='';
});
nbRender();

// On a phone the whole canon is a third of a pixel per chapter, which can be looked at
// but not pointed at. Start such a screen on the Gospels, where a chapter is wide enough
// to tap; the counts above still say the file holds the whole Bible, and the Focus
// control clears back to it in one go.
if(COMPLETE&&window.matchMedia&&window.matchMedia('(max-width:560px)').matches){
  const g=SECTIONS.find(x=>x.name==='The Gospels')||SECTIONS.find(x=>x.name==='New Testament');
  if(g){
    state.focus={from:g.from,to:g.to,label:g.name};
    const pick=document.getElementById('section');
    if(pick)pick.value=g.name;
    try{chip()}catch(e){}
  }
}
render();legend();describe();
})();
</script>
