<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="David Lee">
<meta name="description" content="Biblical cross-references drawn three ways — arc, circle and matrix. Coder: David Lee.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Cross-Reference Lab · Gospel Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' fill='%233e7598'/%3E%3Crect x='18' y='2' width='12' height='12' fill='%23b25c51'/%3E%3Crect x='2' y='18' width='12' height='12' fill='%234e8875'/%3E%3Crect x='18' y='18' width='12' height='12' fill='%23866a9f'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f7f6f1; --panel:#eeeee6; --line:#dedfd5; --ink:#26362f; --muted:#747b73; --faint:#949b91;
  --gold:#b49a4b; --accent:#2e4338; --field:#fffef9;
  --matt:#3e7598; --mark:#b25c51; --luke:#4e8875; --john:#866a9f;
  --serif:Georgia,'Times New Roman',serif;
  --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#13181a; --panel:#1b2124; --line:#2c3438; --ink:#e6e8e2; --muted:#9aa49d; --faint:#79837c;
  --gold:#d4b85e; --accent:#cfe0cf; --field:#1f2629; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#13181a; --panel:#1b2124; --line:#2c3438; --ink:#e6e8e2; --muted:#9aa49d; --faint:#79837c;
  --gold:#d4b85e; --accent:#cfe0cf; --field:#1f2629; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}  /* beats .opt{display:flex} */
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
button,input,select{font:inherit}
.wrap{max-width:1500px;margin:0 auto;padding-block:26px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}
.eyebrow{font-size:10px;letter-spacing:1.7px;font-weight:650;color:var(--faint);margin:0 0 8px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(27px,4vw,40px);letter-spacing:-1.1px;line-height:1.08;margin:0}
h1 em{color:var(--gold);font-style:italic}
.lede{margin:10px 0 0;color:var(--muted);max-width:62ch;font-size:13px}
.counts{display:flex;gap:26px}
.counts div{display:flex;flex-direction:column;gap:4px}
.counts strong{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.counts span{font-size:8px;letter-spacing:1.1px;color:var(--faint)}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:18px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.views{display:flex;gap:4px}
.views button{font-size:13px;padding:9px 16px;border:0;border-radius:5px;background:none;color:var(--muted);cursor:pointer}
.views button[aria-pressed=true]{background:var(--accent);color:var(--paper);font-weight:600}
.search{position:relative;flex:1;min-width:210px;max-width:330px}
.search input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:5px;padding:9px 11px;color:var(--ink);font-size:12px}
.results{position:absolute;z-index:5;top:calc(100% + 5px);left:0;right:0;background:var(--field);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 30px rgba(20,34,28,.16);overflow:hidden}
.results button{display:flex;width:100%;gap:9px;align-items:baseline;padding:9px 11px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--ink);font-size:12px;cursor:pointer}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--panel)}
.results .n{margin-left:auto;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.opt{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.opt select{color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:11px}
.opt input[type=range]{width:88px;accent-color:var(--gold)}
.opt label{display:flex;align-items:center;gap:7px;cursor:pointer}
.opt input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--paper);border-radius:20px;padding:5px 7px 5px 13px;font-size:11px}
.chip button{background:none;border:0;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 4px;opacity:.8}
.spacer{margin-left:auto}
.ghost{font-size:11px;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-top:18px}
.plot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;min-width:0;padding-bottom:30px}
canvas{display:block;width:100%;touch-action:pan-y}
canvas:focus-visible{outline:2px solid var(--gold);outline-offset:-3px}
.caption{position:absolute;left:14px;bottom:9px;right:14px;font-size:10px;color:var(--faint);pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:17px 18px;min-width:0}
.panel h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:4px 0 2px;letter-spacing:-.4px}
.panel .sub{font-size:11px;color:var(--muted);margin:0 0 14px}
.links{list-style:none;margin:0;padding:0;max-height:430px;overflow:auto}
.links li{display:block;border-top:1px solid var(--line);font-size:12px}
.link-head{display:flex;align-items:baseline;gap:9px;padding:7px 0;cursor:pointer}
.link-head .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;align-self:center}
.link-head .plus{color:var(--faint);font-size:13px;line-height:1;width:11px;text-align:center}
.links li.open .link-head .plus{color:var(--gold)}
.link-body{padding:2px 0 12px 16px;border-left:2px solid var(--line);margin:0 0 8px 3px}
.links li.open .link-body{border-left-color:var(--gold)}
.link-body .ref{display:block;font-size:10px;letter-spacing:.03em;color:var(--muted);margin:9px 0 3px}
.link-body .ref:first-child{margin-top:2px}
.link-body p{font-family:var(--serif);font-size:13px;line-height:1.65;margin:0;color:var(--ink)}
.link-body .arrow{color:var(--gold)}
.link-body .all{background:none;border:0;padding:8px 0 0;color:var(--gold);font-size:11px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.links .ref{flex:1;min-width:0}
.links .n{font-variant-numeric:tabular-nums;color:var(--faint);font-size:11px}
.links .turn{order:3;background:none;border:0;color:var(--faint);cursor:pointer;font-size:13px;line-height:1;padding:0 2px;margin-left:6px}
.links .turn:hover,.links .turn:focus-visible{color:var(--gold)}
.more{display:block;margin:16px auto 0;background:none;border:1px solid var(--line);border-radius:5px;color:var(--muted);font-size:12px;padding:10px 18px;cursor:pointer}
.more:hover{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.ramp{height:8px;width:104px;border-radius:2px}
.passages{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px 22px}
.passages-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:4px}
.passages-top h2{font-family:var(--serif);font-weight:400;font-size:23px;margin:0;letter-spacing:-.4px}
.passages-top .sub{font-size:11px;color:var(--muted);margin:0}
.passages-top .ghost{margin-left:auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}
.pair:last-child{border-bottom:0}
.verse-card{min-width:0}
.verse-card h3{font-size:11px;font-weight:650;letter-spacing:.04em;margin:0 0 7px;color:var(--muted)}
.verse-card h3 b{color:var(--ink);font-weight:650}
.verse-card p{font-family:var(--serif);font-size:15px;line-height:1.7;margin:0}
.verse-card.target h3 b{color:var(--gold)}
.pair-votes{grid-column:1/-1;font-size:10px;color:var(--faint)}
@media(max-width:700px){.pair{grid-template-columns:1fr;gap:10px}}
footer{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;font-size:11px;color:var(--faint);line-height:1.8;max-width:80ch}
footer a{color:inherit}
footer p{margin:0 0 7px}
.build{color:var(--ink);font-variant-numeric:tabular-nums}
.loading{min-height:52vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:var(--muted)}
.loading h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;color:var(--ink)}
@media(max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.links{max-height:260px}.counts{gap:18px}.counts strong{font-size:20px}.search{max-width:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap" id="root">
  <div class="loading"><h2>Cross-Reference Lab</h2><p>Opening the link data…</p></div>
</div>
<noscript><p style="padding:24px">This page needs JavaScript enabled in your browser.</p></noscript>

<script id="payload" type="application/octet-stream">__PAYLOAD__</script>
<script>
(async function(){
'use strict';
const root=document.getElementById('root');
let DATA;
try{
  if(!window.DecompressionStream)throw new Error('Please open this page in an up-to-date version of Chrome, Firefox, Edge or Safari.');
  const bytes=Uint8Array.from(atob(document.getElementById('payload').textContent.trim()),c=>c.charCodeAt(0));
  DATA=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
}catch(e){
  root.innerHTML='<div class="loading"><h2>Cross-Reference Lab</h2><p>This page could not open. '+e.message+'</p></div>';
  return;
}

const BOOKS=DATA.books.map(([code,name,first,chapters])=>({code,name,first,chapters}));
const CHAPTERS=DATA.chapterVerses;
const N=CHAPTERS.length;
const NT=DATA.testamentSplit;
const COMPLETE=DATA.scope==='complete';
const TEXT=DATA.text.split('\n');
// Where each chapter starts in the global verse numbering, so a verse index can be named.
const CHAPTER_START=new Int32Array(DATA.chapterVerses.length);
for(let c=1,run=DATA.chapterVerses[0];c<DATA.chapterVerses.length;c++){CHAPTER_START[c]=run;run+=DATA.chapterVerses[c]}
const CHAPTER_OF_VERSE=new Int16Array(TEXT.length);
for(let c=0,v=0;c<DATA.chapterVerses.length;c++)for(let k=0;k<DATA.chapterVerses[c];k++)CHAPTER_OF_VERSE[v++]=c;
// Verse-level links, delta-decoded, and the chapter pairs derived from them.
const COUNT=DATA.links.length/4;
const VL_FROM=new Int32Array(COUNT),VL_TO=new Int32Array(COUNT),VL_SPAN=new Int16Array(COUNT),VL_VOTES=new Int16Array(COUNT);
for(let i=0,run=0;i<COUNT;i++){
  run+=DATA.links[i*4];
  VL_FROM[i]=run;VL_TO[i]=DATA.links[i*4+1];VL_SPAN[i]=DATA.links[i*4+2];VL_VOTES[i]=Math.min(32767,DATA.links[i*4+3]);
}
DATA.links=null;DATA.text=null;
const PAIR_COUNT=new Map();
const LINKS=(()=>{
  const pairs=PAIR_COUNT;
  for(let i=0;i<COUNT;i++){
    const a=CHAPTER_OF_VERSE[VL_FROM[i]],b=CHAPTER_OF_VERSE[VL_TO[i]];
    const key=a*2000+b;
    const row=pairs.get(key);
    if(row){row[2]++;row[3]+=VL_VOTES[i]}else pairs.set(key,[a,b,1,VL_VOTES[i]]);
  }
  return [...pairs.values()].sort((x,y)=>y[2]-x[2]);
})();
// How many verse links a chapter pair holds, so the passage list obeys the same
// threshold as the drawing rather than quietly showing more than the row promised.
const pairCount=(a,b)=>{const r=PAIR_COUNT.get(a*2000+b);return r?r[2]:0};
const bookOfChapter=new Int16Array(N),chapterNumber=new Int16Array(N);
BOOKS.forEach((b,bi)=>{for(let c=0;c<b.chapters;c++){bookOfChapter[b.first+c]=bi;chapterNumber[b.first+c]=c+1}});
const shortName=n=>n.split(' of ')[0];
const label=i=>BOOKS[bookOfChapter[i]].name+' '+chapterNumber[i];
const verseLabel=v=>{const c=CHAPTER_OF_VERSE[v];return label(c)+':'+(v-CHAPTER_START[c]+1)};
const verseRange=(v,span)=>span?verseLabel(v)+'\u2013'+(v+span-CHAPTER_START[CHAPTER_OF_VERSE[v+span]]+1):verseLabel(v);
const maxVerses=Math.max.apply(null,CHAPTERS);
const sources=[...new Set(LINKS.map(l=>l[0]))].sort((a,b)=>a-b);
const sourceSlot=new Map(sources.map((c,i)=>[c,i]));
const fmt=n=>n.toLocaleString('en-GB');

root.innerHTML=`
  <header>
    <div>
      <p class="eyebrow">GOSPEL ATLAS · CROSS-REFERENCE LAB</p>
      <h1>Where Scripture <em>points</em>.</h1>
      <p class="lede">${COMPLETE?'Every cross-reference in the collection':'Every cross-reference that starts in Matthew, Mark, Luke or John'}, drawn three ways from the same data. Narrow it to one book, or to a section \u2014 the Law, the Prophets, Paul\u2019s Letters \u2014 and read what crosses into it.</p>
    </div>
    <div class="counts">
      <div><strong>${fmt(LINKS.reduce((n,l)=>n+l[2],0))}</strong><span>VERSE LINKS</span></div>
      <div><strong>${fmt(LINKS.length)}</strong><span>CHAPTER PAIRS</span></div>
      <div><strong>${fmt(new Set(LINKS.map(l=>l[1])).size)}</strong><span>CHAPTERS REACHED</span></div>
    </div>
  </header>
  <div class="bar">
    <div class="views" role="group" aria-label="Visualisation form">
      <button data-view="arc" aria-pressed="false">Arc</button>
      <button data-view="circle" aria-pressed="true">Circle</button>
      <button data-view="matrix" aria-pressed="false">Matrix</button>
    </div>
    <div class="search">
      <input id="q" type="search" autocomplete="off" placeholder="Search — Isaiah 53, Ps 22, the Prophets, Paul" aria-label="Search for a book or chapter">
      <div id="results" hidden></div>
    </div>
    <div class="opt">Colour
      <select id="colour" aria-label="Colour mode">
        <option value="distance">By distance</option>
        <option value="testament">By target testament</option>
        ${COMPLETE?'':'<option value="gospel">By Gospel</option>'}
      </select>
    </div>
    <div class="opt"><label><input type="checkbox" id="cbsafe"> Colour-blind safe</label></div>
    <div class="opt">Minimum links <input type="range" id="minlinks" min="1" max="12" value="${COMPLETE?2:1}" aria-label="Minimum verse links per chapter pair"><strong id="minlabel" style="font-variant-numeric:tabular-nums;color:var(--ink)">${COMPLETE?2:1}</strong></div>
    <div class="opt">Focus
      <select id="section" aria-label="Focus on a section of the Bible">
        <option value="">Whole Bible</option>
      </select>
    </div>
    <div id="chipslot"></div>
    <div class="opt" id="dirslot" hidden>Direction
      <select id="direction" aria-label="Which links to show for the focused book">
        <option value="both">Both ways</option>
        <option value="in">Links into it</option>
        <option value="out">Links out of it</option>
      </select>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="clear">Clear</button>
  </div>
  <div class="stage">
    <div class="plot">
      <canvas id="plot" tabindex="0" role="img" aria-label="Cross-reference diagram. Arrow keys step through chapters; the list beside it gives the same links as text."></canvas>
      <p class="caption" id="caption"></p>
    </div>
    <aside class="panel">
      <p class="eyebrow" id="p-eyebrow"></p>
      <h2 id="p-title"></h2>
      <p class="sub" id="p-sub"></p>
      <ul class="links" id="p-list"></ul>
      <div class="legend" id="legend"></div>
    </aside>
  </div>
  <section class="passages" id="passages" hidden>
    <div class="passages-top">
      <div><p class="eyebrow" id="pass-eyebrow"></p><h2 id="pass-title"></h2></div>
      <p class="sub" id="pass-sub"></p>
      <button class="ghost" id="pass-close">Close passages</button>
    </div>
    <div id="pairs"></div>
  </section>
  <footer>
    <p><strong>What this is.</strong> ${DATA.sourceNote} Links are aggregated to directed chapter pairs${COMPLETE?'':', which is why the matrix is a band rather than a square and why the circle’s chords all leave from four sectors'}.</p>
    <p><strong>Data.</strong> Cross-references from <a href="https://www.openbible.info/labs/cross-references/" target="_blank" rel="noreferrer">OpenBible.info</a>, CC BY, snapshot ${DATA.snapshot||''}${DATA.sourceSha256?', sha256 '+DATA.sourceSha256.slice(0,12):''}, derived chiefly from the Treasury of Scripture Knowledge. The votes are a live tally, so they shift between downloads, and a negative total means a link the community voted down; those sort last and are never removed. Chapter and verse counts from the ASV 1901.${DATA.dropped?' '+DATA.dropped+' link'+(DATA.dropped===1?'':'s')+' could not be placed, because '+(DATA.unmapped||[]).slice(0,2).join(' and ')+' '+((DATA.unmapped||[]).length>1?'are verses':'is a verse')+' the ASV does not have; ranges reaching past the ASV\u2019s last verse in a chapter stop there rather than collapsing.':''} The votes order the links; they are not similarity scores, and a missing link does not establish that a passage stands alone.</p>
    <p><strong>Form.</strong> The arc diagram follows the one Chris Harrison and Christoph Römhild made in 2007. This is drawn independently, from different data, and uses none of their artwork. Coder: David Lee. <span class="build">Build ${DATA.built||''}</span> \u2014 if that looks older than you expect, reload the page with Shift held down.</p>
  </footer>`;

// Focus is a contiguous run of chapters, so one book and a section of books
// work through the same mechanism.
const SECTIONS=[
 ['Old Testament','Gen','Mal','ot oldtestament hebrewbible tanakh'],
 ['New Testament','Matt','Rev','nt newtestament'],
 ['The Law','Gen','Deut','pentateuch torah law fivebooks books of moses'],
 ['History','Josh','Esth','historical narrative formerprophets'],
 ['Wisdom and Poetry','Job','Song','wisdom poetry poetical writings'],
 ['Major Prophets','Isa','Dan','majorprophets'],
 ['Minor Prophets','Hos','Mal','minorprophets twelve thetwelve'],
 ['The Prophets','Isa','Mal','prophets prophecy latterprophets'],
 ['The Gospels','Matt','John','gospels fourgospels evangelists'],
 ['Paul\u2019s Letters','Rom','Phlm','paul pauline epistlesofpaul letters'],
 ['General Letters','Heb','Jude','general catholic epistles']
].map(([name,from,to,alias])=>{
  const a=BOOKS.find(b=>b.code===from),z=BOOKS.find(b=>b.code===to);
  return a&&z?{name,from:a.first,to:z.first+z.chapters-1,alias}:null;
}).filter(Boolean);
const state={view:'circle',colour:'distance',cbsafe:false,min:COMPLETE?2:1,hover:null,locked:null,focus:null,dir:'both'};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const GOSPEL={Matt:'--matt',Mark:'--mark',Luke:'--luke',John:'--john'};
const CB={Matt:'#0072b2',Mark:'#d55e00',Luke:'#009e73',John:'#cc79a7'};
const isDark=()=>document.documentElement.dataset.theme==='dark'||(matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light');

function gospelColour(ci){const code=BOOKS[bookOfChapter[ci]].code;return state.cbsafe?(CB[code]||'#888'):(css(GOSPEL[code]||'--muted')||'#888')}
function distanceColour(d){
  if(state.cbsafe){
    const stops=[[11,26,60],[33,86,140],[42,150,146],[132,194,108],[250,228,110]];
    const t=Math.min(.999,Math.max(0,d))*(stops.length-1),i=Math.floor(t),f=t-i;
    const a=stops[i],b=stops[Math.min(stops.length-1,i+1)];
    return 'rgb('+a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(',')+')';
  }
  return 'hsl('+Math.round(272-272*Math.min(1,d))+',72%,52%)';
}
function testamentColour(ci){return bookOfChapter[ci]>=NT?(state.cbsafe?'#0072b2':css('--luke')):(state.cbsafe?'#e69f00':css('--gold'))}
function linkColour(l){
  if(state.colour==='gospel')return gospelColour(l[0]);
  if(state.colour==='testament')return testamentColour(l[1]);
  return distanceColour(Math.round(255*Math.abs(l[1]-l[0])/(N-1))/255);
}

const canvas=document.getElementById('plot'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,base=null;
const geom={};

function sizes(){
  const rect=canvas.parentElement.getBoundingClientRect();
  W=Math.max(300,Math.round(rect.width));
  H=state.view==='arc'?Math.round(Math.min(560,Math.max(300,W*0.42))):Math.round(Math.min(840,Math.max(360,W*0.86)));
  dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.style.height=H+'px';
  canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
}
function layout(){
  if(state.view==='arc'){
    const pad=26,baseY=H-74,barMax=44;
    geom.arc={pad,baseY,barMax,step:(W-pad*2)/N};
    geom.x=i=>pad+(i+0.5)*geom.arc.step;
  }else if(state.view==='circle'){
    const cx=W/2,cy=H/2;
    const focused=state.focus?state.focus.to-state.focus.from+1:0;

function inFocus(ci){return ci>=state.focus.from&&ci<=state.focus.to}
function visible(l){

let byChapter=null,linkLayer=null,renderToken=0,progress=1;
function buildIndex(){
  byChapter=new Map();
  const note=(k,l)=>{const a=byChapter.get(k);a?a.push(l):byChapter.set(k,[l])};
  for(const l of LINKS)if(visible(l)){note(l[0],l);note(l[1],l)}

// The wash is drawn at one device pixel per CSS pixel and built a slice at a time,
// so a full-Bible view appears immediately and fills in instead of freezing the page.
function renderBase(){
  const token=++renderToken;
  layout();          // the circle's geometry depends on the focus, so recompute it here
  buildIndex();
  linkLayer=document.createElement('canvas');
  linkLayer.width=Math.max(1,W);linkLayer.height=Math.max(1,H);
  const c=linkLayer.getContext('2d');
  const dark=isDark();
  const alpha=state.view==='matrix'?(dark?.72:.6):(dark?.26:.2);
  c.lineCap='round';c.lineWidth=state.view==='circle'?.7:.6;
  const list=[];for(const l of LINKS)if(visible(l))list.push(l);
  const CHUNK=state.view==='matrix'?80000:7000;
  let i=0;progress=list.length?0:1;
  (function step(){
    if(token!==renderToken)return;
    const stop=Math.min(list.length,i+CHUNK);
    if(state.view==='matrix'){
      for(;i<stop;i++)drawLink(c,list[i],alpha,.6);
    }else{
      const buckets=new Map();
      for(;i<stop;i++){
        const l=list[i],colour=linkColour(l);
        let path=buckets.get(colour);
        if(!path){path=new Path2D();buckets.set(colour,path)}

      }
      c.globalAlpha=alpha;
      for(const [colour,path] of buckets){c.strokeStyle=colour;c.stroke(path)}

    }

function drawProgress(c){
  c.save();c.fillStyle=css('--gold');c.globalAlpha=.85;

}
function paint(){
  ctx.setTransform(1,0,0,1,0,0);

  ctx.save();ctx.scale(dpr,dpr);
  const focus=state.locked!==null?state.locked:state.hover;

    drawFrame(ctx);

  }
  ctx.globalAlpha=isDark()?.72:.78;ctx.fillStyle=css('--panel');ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;drawFrame(ctx);ctx.lineCap='round';

  if(state.view==='arc'){const x=geom.x(focus);ctx.fillRect(x-1,geom.arc.baseY-6,2,12)}

    const e=geom.end(focus);

function caption(){
  document.getElementById('caption').textContent={
    arc:'Chapters left to right, Genesis 1 to Revelation 22. Bar length is the number of verses; arc height is the distance a link travels.',
    circle:state.focus
      ?'The dial is '+state.focus.label+': one full turn, its chapters numbered. Every chord runs from a chapter out to where it points on the canon ring.'
      :'The whole canon clockwise from Genesis 1 at the top. Chords are pulled toward the centre of each book, so links sharing a destination braid together. Choose a book to make it the dial.',
    matrix:'Each dot is one chapter pair: the chapter a link starts from across the bottom, the chapter it points to down the side. Direction is kept here and nowhere else.'

function render(){sizes();layout();renderBase();caption()}

// ---- selection ----------------------------------------------------------
function chapterAt(px,py){
  if(state.view==='arc'){const i=Math.round((px-geom.arc.pad)/geom.arc.step-0.5);return i>=0&&i<N?i:null}
  if(state.view==='circle'){
    const {cx,cy,R,Rin,focused}=geom.circle,dx=px-cx,dy=py-cy,r=Math.hypot(dx,dy);
    let a=Math.atan2(dy,dx)+Math.PI/2;
    while(a<0)a+=Math.PI*2;while(a>=Math.PI*2)a-=Math.PI*2;
    const wrap=(x,m)=>((Math.round(x)%m)+m)%m;      // the twelve o'clock join belongs to the first slot
    if(focused&&r>Rin*0.42&&r<Rin+30){
      const n=state.focus.to-state.focus.from+1;
      return state.focus.from+(((geom.dialZero-state.focus.from)+wrap(a/(Math.PI*2)*n,n))%n);
    }
    if(r<R*0.62||r>R*1.3)return null;
    return wrap(a/(Math.PI*2)*N,N);
  }
  const m=geom.matrix;
  if(px<m.padL||px>m.padL+sources.length*m.cw)return null;
  return sources[Math.max(0,Math.min(sources.length-1,Math.floor((px-m.padL)/m.cw)))];
}
function select(ci){state.locked=ci;renderBase();describe()}
canvas.addEventListener('pointermove',e=>{
  const r=canvas.getBoundingClientRect(),i=chapterAt(e.clientX-r.left,e.clientY-r.top);
  if(i!==state.hover){state.hover=i;paint();describe()}
});
canvas.addEventListener('pointerleave',()=>{if(state.hover!==null){state.hover=null;paint();describe()}});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect(),i=chapterAt(e.clientX-r.left,e.clientY-r.top);
  state.locked=(i===state.locked)?null:i;renderBase();describe();
});
canvas.addEventListener('keydown',e=>{
  const step={ArrowRight:1,ArrowLeft:-1,ArrowUp:-10,ArrowDown:10}[e.key];
  if(step){e.preventDefault();const from=state.locked!==null?state.locked:0;select(Math.max(0,Math.min(N-1,from+step)));return}
  if(e.key==='Home'){e.preventDefault();select(0)}
  if(e.key==='End'){e.preventDefault();select(N-1)}
  if(e.key==='Escape'){state.locked=null;paint();describe()}
});

// ---- panel --------------------------------------------------------------
// A list row that opens in place, in the manner of the Atlas's connection cards,
// with the full set still available underneath.
function linkRow({colour,text,count,pair,title,extra}){
  const li=document.createElement('li');
  const head=document.createElement('div');head.className='link-head';
  const dot=document.createElement('span');dot.className='dot';dot.style.background=colour;
  const ref=document.createElement('span');ref.className='ref';ref.textContent=text;
  const n=document.createElement('span');n.className='n';n.textContent=count;
  head.append(dot,ref,n);
  if(extra)head.appendChild(extra);
  const plus=document.createElement('span');plus.className='plus';plus.textContent='+';
  head.appendChild(plus);
  const body=document.createElement('div');body.className='link-body';body.hidden=true;
  li.append(head,body);
  head.addEventListener('click',()=>{
    const open=li.classList.toggle('open');
    plus.textContent=open?'\u2212':'+';
    body.hidden=!open;
    if(!open||body.dataset.filled)return;
    body.dataset.filled='1';
    const found=findLinks(pair[0],pair[1],pair[2],pair[3]);
    if(!found.length){const p=document.createElement('p');p.textContent='No verse-level links here under the current filters.';body.appendChild(p);return}
    let lastFrom=-1;
    found.slice(0,4).forEach(i=>{
      if(VL_FROM[i]!==lastFrom){            // several links often share one source verse
        const a=document.createElement('span');a.className='ref';
        a.textContent=verseLabel(VL_FROM[i]);body.appendChild(a);
        const pa=document.createElement('p');pa.textContent=TEXT[VL_FROM[i]]||'';body.appendChild(pa);
        lastFrom=VL_FROM[i];
      }
      const z=document.createElement('span');z.className='ref';
      z.innerHTML='<span class="arrow">\u2192</span> '+verseRange(VL_TO[i],VL_SPAN[i]);body.appendChild(z);
      const pz=document.createElement('p');
      let t='';for(let v=VL_TO[i];v<=VL_TO[i]+VL_SPAN[i];v++)t+=(t?' ':'')+(TEXT[v]||'');
      pz.textContent=t;body.appendChild(pz);
    });
    const all=document.createElement('button');all.type='button';all.className='all';
    all.textContent=found.length>4?'Read all '+fmt(found.length)+' in full \u2193':'Open in full \u2193';
    all.addEventListener('click',e=>{e.stopPropagation();openPassages(pair[0],pair[1],pair[2],pair[3],title)});
    body.appendChild(all);
  });
  return li;
}

function describe(){
  const focus=state.locked!==null?state.locked:state.hover;
  const eyebrow=document.getElementById('p-eyebrow'),title=document.getElementById('p-title'),
        sub=document.getElementById('p-sub'),list=document.getElementById('p-list');
  list.innerHTML='';
  if(focus===null||focus===undefined){
    if(state.focus){
      // Which other books this one actually talks to, which is the question the bezel asks.
      const byBook=new Map();let crossing=0,internal=0;
      for(const l of LINKS){
        if(l[2]<state.min)continue;
        const a=inFocus(l[0]),b=inFocus(l[1]);
        if(!a&&!b)continue;
        if(a&&b){internal+=l[2];continue}
        if(state.dir==='out'&&!a)continue;
        if(state.dir==='in'&&!b)continue;
        const other=bookOfChapter[a?l[1]:l[0]];
        byBook.set(other,(byBook.get(other)||0)+l[2]);crossing+=l[2];
      }
      eyebrow.textContent='LINKED BOOKS';
      title.textContent=state.focus.label;
      sub.textContent=crossing
        ? fmt(crossing)+' links cross its boundary, to '+byBook.size+' other books'+(internal?', and '+fmt(internal)+' stay inside it':'')+'. Pick one to read the passages; the dial button turns the ring to it.'
        : 'No links cross its boundary in the current subset.';
      [...byBook.entries()].sort((a,b)=>b[1]-a[1]).slice(0,16).forEach(([bi,n])=>{
        const b=BOOKS[bi];
        const turn=document.createElement('button');
        turn.type='button';turn.className='turn';turn.title='Make '+shortName(b.name)+' the dial';
        turn.setAttribute('aria-label','Turn the dial to '+shortName(b.name));
        turn.textContent='\u25cc';
        turn.addEventListener('click',e=>{
          e.stopPropagation();
          state.focus={from:b.first,to:b.first+b.chapters-1,label:shortName(b.name)};
          state.locked=null;input.value=shortName(b.name);chip();renderBase();describe();
        });
        list.appendChild(linkRow({
          colour:testamentColour(b.first),text:shortName(b.name),count:fmt(n)+' links',
          pair:[state.focus.from,state.focus.to,b.first,b.first+b.chapters-1],
          title:state.focus.label+' \u2194 '+shortName(b.name),extra:turn
        }));
      });
      return;
    }
    eyebrow.textContent='BUSIEST CHAPTERS';
    title.textContent='Start anywhere';
    sub.textContent='Move across the drawing to isolate a chapter, or pick one here. Click to hold a selection; arrow keys step through once the drawing has focus.';
    const totals=new Map();
    for(const l of LINKS)if(visible(l))totals.set(l[0],(totals.get(l[0])||0)+l[2]);
    [...totals.entries()].sort((a,b)=>b[1]-a[1]).slice(0,14).forEach(([ci,n])=>{
      const li=document.createElement('li');
      const head=document.createElement('div');head.className='link-head';
      const dot=document.createElement('span');dot.className='dot';
      dot.style.background=COMPLETE?testamentColour(ci):gospelColour(ci);
      const ref=document.createElement('span');ref.className='ref';ref.textContent=label(ci);
      const cnt=document.createElement('span');cnt.className='n';cnt.textContent=fmt(n)+' links';
      head.append(dot,ref,cnt);li.appendChild(head);
      head.addEventListener('click',()=>select(ci));
      list.appendChild(li);
    });
    return;
  }
  const out=LINKS.filter(l=>visible(l)&&l[0]===focus).sort((a,b)=>b[2]-a[2]);
  const incoming=LINKS.filter(l=>visible(l)&&l[1]===focus).sort((a,b)=>b[2]-a[2]);
  const rows=out.length?out:incoming;
  eyebrow.textContent=(state.locked!==null?'HELD · ':'')+(out.length?'OUTGOING':'INCOMING');
  title.textContent=label(focus);
  sub.textContent=out.length
    ?fmt(out.reduce((n,l)=>n+l[2],0))+' links out of '+CHAPTERS[focus]+' verses, reaching '+out.length+' chapters. Pick one to read the verses.'
    :incoming.length?'No outgoing links in this subset. '+fmt(incoming.reduce((n,l)=>n+l[2],0))+' links arrive here.'
    :'No links in the current subset.';
  rows.slice(0,60).forEach(l=>{
    const other=out.length?l[1]:l[0];
    const a=out.length?focus:other,z=out.length?other:focus;
    list.appendChild(linkRow({
      colour:linkColour(l),text:label(other),count:l[2]+(l[2]===1?' link':' links'),
      pair:[a,a,z,z],title:label(a)+' \u2194 '+label(z)
    }));
  });
}
let passageState=null;
// Every link row opens the text behind it, whether that row is one chapter or a whole book.
function findLinks(aFrom,aTo,bFrom,bTo){
  const found=[];
  for(let i=0;i<COUNT;i++){
    const ca=CHAPTER_OF_VERSE[VL_FROM[i]],cb=CHAPTER_OF_VERSE[VL_TO[i]];
    const forward=ca>=aFrom&&ca<=aTo&&cb>=bFrom&&cb<=bTo;
    const back=ca>=bFrom&&ca<=bTo&&cb>=aFrom&&cb<=aTo;
    if(!forward&&!back)continue;
    if(pairCount(ca,cb)<state.min)continue;
    if(state.focus){
      if(state.dir==='out'&&!forward)continue;
      if(state.dir==='in'&&!back)continue;
    }
    found.push(i);
  }
  found.sort((x,y)=>VL_VOTES[y]-VL_VOTES[x]||VL_FROM[x]-VL_FROM[y]);
  return found;
}
function renderPassages(){
  const {found,shown,title}=passageState;
  const list=document.getElementById('pairs');
  document.getElementById('pass-eyebrow').textContent='PASSAGES BEHIND THE LINK';
  document.getElementById('pass-title').textContent=title;
  document.getElementById('pass-sub').textContent=found.length
    ? (found.length>shown?'Showing the strongest '+shown+' of '+fmt(found.length)+' links':fmt(found.length)+(found.length===1?' link':' links')+', strongest first')
      +' \u00b7 American Standard Version 1901'
    : 'No verse-level links here under the current filters.';
  list.innerHTML='';
  found.slice(0,shown).forEach(i=>{
    const row=document.createElement('div');row.className='pair';
    const from=document.createElement('article');from.className='verse-card';
    from.innerHTML='<h3>FROM <b>'+verseLabel(VL_FROM[i])+'</b></h3>';
    const fp=document.createElement('p');fp.textContent=TEXT[VL_FROM[i]]||'';from.appendChild(fp);
    const to=document.createElement('article');to.className='verse-card target';
    to.innerHTML='<h3>TO <b>'+verseRange(VL_TO[i],VL_SPAN[i])+'</b></h3>';
    for(let v=VL_TO[i];v<=VL_TO[i]+VL_SPAN[i];v++){
      const tp=document.createElement('p');
      tp.textContent=(VL_SPAN[i]?(v-CHAPTER_START[CHAPTER_OF_VERSE[v]]+1)+'. ':'')+(TEXT[v]||'');
      to.appendChild(tp);
    }
    const votes=document.createElement('p');votes.className='pair-votes';
    votes.textContent=VL_VOTES[i]<0
      ? VL_VOTES[i]+' at OpenBible \u2014 voted down'
      : VL_VOTES[i]+(VL_VOTES[i]===1?' vote':' votes')+' at OpenBible';
    row.append(from,to,votes);list.appendChild(row);
  });
  if(found.length>shown){
    const more=document.createElement('button');more.type='button';more.className='more';
    more.textContent='Show '+Math.min(40,found.length-shown)+' more';
    more.addEventListener('click',()=>{passageState.shown+=40;renderPassages()});
    list.appendChild(more);
  }
}
function openPassages(aFrom,aTo,bFrom,bTo,title){
  passageState={found:findLinks(aFrom,aTo,bFrom,bTo),shown:40,title};
  renderPassages();
  const box=document.getElementById('passages');
  box.hidden=false;
  box.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}
function openChapterPair(a,b){openPassages(a,a,b,b,label(a)+' \u2194 '+label(b))}
document.getElementById('pass-close').addEventListener('click',()=>{document.getElementById('passages').hidden=true});

function legend(){
  const el=document.getElementById('legend');el.innerHTML='';
  if(state.colour==='distance'){
    const ramp=document.createElement('div');ramp.className='ramp';
    ramp.style.background='linear-gradient(90deg,'+[0,.25,.5,.75,1].map(distanceColour).join(',')+')';
    const a=document.createElement('span');a.textContent='nearby';
    const b=document.createElement('span');b.textContent='across the Bible';
    el.append(a,ramp,b);
  }else if(state.colour==='gospel'){
    ['Matt','Mark','Luke','John'].forEach(code=>{
      const s=document.createElement('span');
      s.innerHTML='<i style="background:'+(state.cbsafe?CB[code]:css(GOSPEL[code]))+'"></i>'+BOOKS.find(b=>b.code===code).name;
      el.appendChild(s);
    });
  }else{
    [['Old Testament',testamentColour(0)],['New Testament',testamentColour(BOOKS[NT].first)]].forEach(([t,c])=>{
      const s=document.createElement('span');s.innerHTML='<i style="background:'+c+'"></i>'+t;el.appendChild(s);
    });
  }
}

// ---- search -------------------------------------------------------------
const norm=s=>s.toLowerCase().replace(/^1\s*/,'i ').replace(/^2\s*/,'ii ').replace(/^3\s*/,'iii ').replace(/[^a-z0-9]+/g,'');
// Contractions people actually type, which are not prefixes of the full name.
const EXTRA={Gen:'gn ge',Exod:'ex exo',Lev:'lv',Num:'nm',Deut:'dt',Josh:'jos',Judg:'jdg jg',Ruth:'rth',
 '1Sam':'1sa 1sm firstsamuel','2Sam':'2sa 2sm secondsamuel','1Kgs':'1ki 1kg firstkings','2Kgs':'2ki 2kg secondkings',
 '1Chr':'1ch firstchronicles','2Chr':'2ch secondchronicles',Neh:'ne',Esth:'es',Ps:'psa psalm',Prov:'pr prv',
 Eccl:'ec qoheleth',Song:'sos sng canticles',Isa:'is',Jer:'jr',Lam:'lm',Ezek:'ezk eze',Dan:'dn',Hos:'ho',
 Obad:'ob',Jonah:'jon',Mic:'mi',Nah:'na',Hab:'hb',Zeph:'zep',Hag:'hg',Zech:'zec',Mal:'ml',
 Matt:'mt mat',Mark:'mk mr',Luke:'lk',John:'jn jhn',Acts:'ac',Rom:'rm',
 '1Cor':'1co firstcorinthians','2Cor':'2co secondcorinthians',Gal:'ga',Eph:'ep',Phil:'php',Col:'co',
 '1Thess':'1th','2Thess':'2th','1Tim':'1ti','2Tim':'2ti',Titus:'ti',Phlm:'phm',Heb:'hb heb',Jas:'jm jas',
 '1Pet':'1pe','2Pet':'2pe','1John':'1jn','2John':'2jn','3John':'3jn',Jude:'jud',Rev:'rv apocalypse'};
const ALIASES=BOOKS.map((b,bi)=>({bi,keys:[norm(b.name),norm(shortName(b.name)),norm(b.code)]
  .concat((EXTRA[b.code]||'').split(' ').filter(Boolean).map(x=>x.toLowerCase().replace(/[^a-z0-9]+/g,'')))}));
const totalsByChapter=(()=>{const m=new Map();for(const l of LINKS){m.set(l[0],(m.get(l[0])||0)+l[2]);m.set(l[1],(m.get(l[1])||0)+l[2])}return m})();
function lookup(query){
  const text=query.trim();
  if(!text)return [];
  const m=text.match(/^(.*?)[\s.]*(\d+)?\s*[:.]?\s*(\d+)?\s*$/);
  const rawName=(m&&m[1]?m[1]:text).toLowerCase().replace(/[^a-z0-9]+/g,'');
  const namePart=norm(m&&m[1]?m[1]:text), chapterPart=m&&m[2]?+m[2]:null;
  if(!namePart&&!rawName)return [];
  const score=a=>{
    const k=a.keys;
    if(k.some(x=>x===namePart||x===rawName))return 0;              // the book's own code or name
    if(k.some(x=>x.startsWith(namePart)||(rawName&&x.startsWith(rawName))))return 1;
    if(k.some(x=>x.includes(namePart)||(rawName&&x.includes(rawName))))return 2;
    return 9;
  };
  const ranked=ALIASES.map(a=>({a,s:score(a)})).filter(x=>x.s<9)
    .sort((x,y)=>{
      if(chapterPart){                                              // a book that has that chapter comes first
        const hx=chapterPart<=BOOKS[x.a.bi].chapters?0:1, hy=chapterPart<=BOOKS[y.a.bi].chapters?0:1;
        if(hx!==hy)return hx-hy;
      }
      return x.s-y.s||x.a.bi-y.a.bi;
    });
  const out=[];
  const sq=namePart||rawName;
  SECTIONS.map(sec=>{
    const keys=[norm(sec.name)].concat(sec.alias.split(' '));
    const rank=keys.some(k=>k===sq)?0:keys.some(k=>k.startsWith(sq))?1:keys.some(k=>k.includes(sq))?2:9;
    return {sec,rank};
  }).filter(x=>x.rank<9).sort((a,b)=>a.rank-b.rank).slice(0,3)
    .forEach(({sec})=>out.push({kind:'range',from:sec.from,to:sec.to,label:sec.name,
      text:sec.name+' · section',n:(sec.to-sec.from+1)+' chapters'}));
  for(const {a} of ranked){
    const b=BOOKS[a.bi];
    if(chapterPart&&chapterPart>=1&&chapterPart<=b.chapters){
      const ci=b.first+chapterPart-1;
      out.push({kind:'chapter',ci,text:label(ci),n:totalsByChapter.get(ci)||0});
    }
    out.push({kind:'range',from:b.first,to:b.first+b.chapters-1,label:shortName(b.name),text:shortName(b.name)+' · whole book',n:b.chapters+' chapters'});
    if(out.length>=8)break;
  }
  return out.slice(0,8);
}
const input=document.getElementById('q'),results=document.getElementById('results');
function showResults(){
  const items=lookup(input.value);
  results.innerHTML='';
  if(!items.length){results.hidden=true;return}
  items.forEach(it=>{
    const b=document.createElement('button');b.type='button';
    const t=document.createElement('span');t.textContent=it.text;
    const n=document.createElement('span');n.className='n';n.textContent=typeof it.n==='number'?fmt(it.n)+' links':it.n;
    b.append(t,n);
    b.addEventListener('click',()=>{choose(it)});
    results.appendChild(b);
  });
  results.hidden=false;
}
function choose(it){
  results.hidden=true;
  input.value=it.kind==='chapter'?it.text:it.label;
  if(it.kind==='chapter'){state.focus=null;chip();renderBase();select(it.ci)}
  else{state.focus={from:it.from,to:it.to,label:it.label};state.locked=null;chip();renderBase();describe()}
}
input.addEventListener('input',showResults);
input.addEventListener('focus',showResults);
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const items=lookup(input.value);if(items.length){e.preventDefault();choose(items[0])}}
  if(e.key==='Escape'){results.hidden=true;input.blur()}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.hidden=true});
function chip(){
  const slot=document.getElementById('chipslot');slot.innerHTML='';
  document.getElementById('dirslot').hidden=!state.focus;
  const sel=document.getElementById('section');
  if(sel)sel.value=state.focus&&SECTIONS.some(x=>x.name===state.focus.label)?state.focus.label:'';
  if(!state.focus)return;
  const c=document.createElement('span');c.className='chip';
  c.append(document.createTextNode('Only '+state.focus.label));
  const x=document.createElement('button');x.type='button';
  x.setAttribute('aria-label','Show the whole Bible again');x.textContent='×';
  x.addEventListener('click',clearFocus);
  c.appendChild(x);slot.appendChild(c);
}
function clearFocus(){state.focus=null;input.value='';chip();renderBase();describe()}

// ---- controls -----------------------------------------------------------
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>{
  state.view=b.dataset.view;
  document.querySelectorAll('.views button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  render();describe();
}));
document.getElementById('colour').addEventListener('change',e=>{state.colour=e.target.value;renderBase();legend();describe()});
document.getElementById('cbsafe').addEventListener('change',e=>{state.cbsafe=e.target.checked;renderBase();legend();describe()});
document.getElementById('minlinks').addEventListener('input',e=>{
  state.min=+e.target.value;document.getElementById('minlabel').textContent=e.target.value;renderBase();describe();
});
(function(){
  const sel=document.getElementById('section');
  SECTIONS.forEach(x=>{const o=document.createElement('option');o.value=x.name;o.textContent=x.name;sel.appendChild(o)});
  sel.addEventListener('change',e=>{
    const sec=SECTIONS.find(x=>x.name===e.target.value);
    if(!sec){clearFocus();return}
    state.focus={from:sec.from,to:sec.to,label:sec.name};state.locked=null;input.value='';
    chip();renderBase();describe();
  });
})();
document.getElementById('direction').addEventListener('change',e=>{state.dir=e.target.value;renderBase();describe()});
document.getElementById('clear').addEventListener('click',()=>{
  state.locked=null;state.hover=null;state.focus=null;state.dir='both';
  document.getElementById('direction').value='both';input.value='';chip();renderBase();describe();
});
let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(render,160)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{renderBase();legend()});

render();legend();describe();
})();
</script>
